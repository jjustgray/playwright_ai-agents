name: Playwright AI Agents CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run Playwright Tests & Send to Qase
        env:
          QASE_MODE: ${{ vars.QASE_MODE }}
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          BASE_URL: ${{ vars.BASE_URL }}
          CALENDLY_TEST_EMAIL: ${{ vars.CALENDLY_TEST_EMAIL }}
        run: npx playwright test
        continue-on-error: true

      - name: Upload Video Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-videos-and-reports
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: playwright-report/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add Report Link to Summary
        run: |
          echo "### 📊 Playwright Test Report" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Open HTML Report](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
